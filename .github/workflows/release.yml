name: Release

# After CI passes on main: releases an unreleased plugin.json version, or bumps and releases when a
# commit since the last release says "release" (see .github/next-version.sh and the README).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Bump before releasing (none releases the current version if it has no release)
        type: choice
        options: [none, patch, minor, major]
        default: none

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      BUMP: ${{ inputs.bump || 'none' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
          fetch-tags: true
      - name: Decide
        id: v
        run: |
          name=$(jq -r .name .claude-plugin/plugin.json)
          version=$(jq -r .version .claude-plugin/plugin.json)
          echo "$name" | grep -Eq '^[a-z0-9][a-z0-9-]*$' \
            || { echo "::error::plugin.json name '$name' is not kebab-case"; exit 1; }
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::plugin.json version '$version' is not x.y.z"; exit 1; }
          next=
          if [ "$BUMP" != none ]; then
            next=$(printf 'release %s\n' "$BUMP" | sh .github/next-version.sh "$version")
          elif gh release view "$name--v$version" > /dev/null 2>&1; then
            last=$(git describe --tags --abbrev=0 --match "$name--v*" "$SHA" 2>/dev/null || true)
            next=$(git log --format=%B "${last:+$last..}$SHA" | sh .github/next-version.sh "$version")
            if [ -z "$next" ]; then
              echo "$name $version is released and no commit since ${last:-the start} asks for a release."
              echo "skip=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "Releasing $name ${next:-$version}${next:+ (bumped from $version)}."
          {
            echo "name=$name"
            echo "version=${next:-$version}"
            echo "bump=${next:+1}"
          } >> "$GITHUB_OUTPUT"
      - name: Commit the version bump
        if: steps.v.outputs.bump == '1'
        env:
          VERSION: ${{ steps.v.outputs.version }}
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          jq --arg v "$VERSION" '.version = $v' .claude-plugin/plugin.json > plugin.json.tmp
          mv plugin.json.tmp .claude-plugin/plugin.json
          sed -i -E "s#img.shields.io/badge/release-v[0-9.]+-blue#img.shields.io/badge/release-v$VERSION-blue#" README.md
          grep -q "img.shields.io/badge/release-v$VERSION-blue" README.md \
            || { echo "::error::README release badge not found"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Version $VERSION"
          git push origin "HEAD:refs/heads/$BRANCH" \
            || { echo "::error::$BRANCH moved past $SHA; rerun this workflow on the newer commit"; exit 1; }
          echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Create the release if it doesn't exist
        if: steps.v.outputs.skip != '1'
        env:
          TAG: ${{ steps.v.outputs.name }}--v${{ steps.v.outputs.version }}
          TITLE: ${{ steps.v.outputs.name }} ${{ steps.v.outputs.version }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
          else
            gh release create "$TAG" --target "$SHA" --generate-notes --title "$TITLE"
            echo "Created release $TAG at $SHA."
          fi
